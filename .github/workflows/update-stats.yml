name: Update GitHub Stats

on:
  schedule:
    - cron: '0 * * * *'  # every hour
  workflow_dispatch:      # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub stats
        run: |
          USER="jlaiii"
          USER_DATA=$(curl -sf "https://api.github.com/users/$USER")
          PUBLIC_REPOS=$(echo "$USER_DATA" | jq '.public_repos')

          REPOS=$(curl -sf "https://api.github.com/users/$USER/repos?per_page=100")
          TOTAL_STARS=$(echo "$REPOS" | jq '[.[].stargazers_count] | add // 0')

          jq -n \
            --argjson repos "$PUBLIC_REPOS" \
            --argjson stars "$TOTAL_STARS" \
            '{public_repos: $repos, total_stars: $stars}' \
            > stats.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then
            echo "No changes to stats.json"
          else
            git commit -m "Update stats.json [skip ci]"
            git push
          fi
